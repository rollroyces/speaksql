name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull full history so the demo recordings are present.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install (dev only — needed for the demo recorder)
        run: uv sync --python 3.12 --extra dev --extra service

      - name: Re-record the demos so they're fresh
        run: |
          mkdir -p docs
          for name in demo format repl diff; do
            out="docs/demo${name:+.$name}.cast"
            [ "$name" = "demo" ] && out="docs/demo.cast"
            uv run --python 3.12 python scripts/record_demo.py "$out" "$name"
          done

      - name: Verify the recordings
        run: uv run --python 3.12 pytest tests/test_record_demo.py -q

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4