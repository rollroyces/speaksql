[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speaksql"
version = "0.1.0"
description = "Speak once. Query any dialect. NL-to-SQL transpiled across Postgres, MySQL, Snowflake, BigQuery, SQL Server, Databricks, DuckDB, and SAP HANA."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [{ name = "Royce" }]
keywords = ["sql", "transpile", "dialect", "nl-to-sql", "postgres", "snowflake", "bigquery", "databricks", "duckdb", "hana"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
]
dependencies = [
  "sqlglot>=23.0",
  "click>=8.1",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Service extras are pinned to a known-good combination across Python 3.11-3.13.
# starlette <0.41 keeps httpx (not httpx2) as the testclient backend, which
# avoids a fragile httpx2 dependency. FastAPI is pinned to the matching line.
service = [
  "fastapi>=0.110,<0.116",
  "starlette<0.41",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27,<0.29",
]

# Per-dialect backend drivers. Install only what you need to keep installs
# lean; SpeakSQL works without any of these (just transpilation).
postgres = ["psycopg[binary]>=3.1"]
duckdb = ["duckdb>=0.10"]
snowflake = ["snowflake-connector-python>=3.0"]
bigquery = ["google-cloud-bigquery>=3.0"]

# All backends combined. Useful for local dev / roundtrip testing.
backends = [
  "psycopg[binary]>=3.1",
  "duckdb>=0.10",
  "snowflake-connector-python>=3.0",
  "google-cloud-bigquery>=3.0",
]

dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
speaksql = "speaksql.cli:main"

[project.urls]
Homepage = "https://github.com/rollroyces/speaksql"
Issues = "https://github.com/rollroyces/speaksql/issues"
Repository = "https://github.com/rollroyces/speaksql"

[tool.hatch.build.targets.wheel]
packages = ["src/speaksql"]

[tool.ruff]
line-length = 100
src = ["src/speaksql", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "service: tests that require the optional [service] extra (fastapi, starlette, httpx).",
]